name: qassimha
description: قسّمها - تقسيم المصاريف بين الأصدقاء والعائلة
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  share_plus: ^10.0.0
  shared_preferences: ^2.3.0
  path_provider: ^2.1.0
  image_picker: ^1.1.0
  google_mlkit_text_recognition: ^0.13.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "icon.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#0E7C66"
  adaptive_icon_foreground: "icon_fg.png"

flutter:
  uses-material-design: true
