name: Build Qassimha

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate platform folders
        run: |
          flutter create . --project-name qassimha --org com.qassimha --platforms=android,ios
          rm -rf test

      - name: Set Arabic app name
        run: sed -i 's/android:label="[^"]*"/android:label="قسّمها"/' android/app/src/main/AndroidManifest.xml

      - run: flutter pub get

      - name: Generate app icon
        continue-on-error: true
        run: dart run flutter_launcher_icons

      - name: Add R8 rules for ML Kit
        run: |
          printf '%s\n' '-dontwarn com.google.mlkit.vision.text.**' > android/app/proguard-rules.pro
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's|signingConfig = signingConfigs.getByName("debug")|&\n            proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")|' android/app/build.gradle.kts
          else
            sed -i "s|signingConfig signingConfigs.debug|\&\n            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'|" android/app/build.gradle
          fi
          grep -n proguardFiles android/app/build.gradle* || echo "WARNING: proguardFiles was not added"

      - name: Build APK (release)
        id: release
        continue-on-error: true
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee build.log

      - name: Show Android errors
        if: steps.release.outcome == 'failure'
        run: |
          {
            echo '### Android release build failed'
            echo '```'
            grep -n -E -A3 "Caused by|Missing class|What went wrong|Execution failed|CompilationFailed|error:" build.log | head -80 || true
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Build APK (debug fallback)
        if: steps.release.outcome == 'failure'
        run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: qassimha-android-apk
          path: build/app/outputs/flutter-apk/*.apk

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate platform folders
        run: |
          flutter create . --project-name qassimha --org com.qassimha --platforms=android,ios
          rm -rf test

      - name: Set Arabic app name
        run: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName قسّمها" ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string نحتاج الكاميرا لقراءة الفاتورة" ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string نحتاج الوصول للصور لقراءة الفاتورة" ios/Runner/Info.plist
          sed -i '' "s/^#* *platform :ios, .*/platform :ios, '15.5'/" ios/Podfile
          sed -i '' "s/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*;/IPHONEOS_DEPLOYMENT_TARGET = 15.5;/g" ios/Runner.xcodeproj/project.pbxproj

      - run: flutter pub get

      - name: Generate app icon
        continue-on-error: true
        run: dart run flutter_launcher_icons

      - run: flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        run: |
          mkdir Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -r qassimha.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: qassimha-ios-ipa
          path: qassimha.ipa
