name: Build Qassimha

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate platform folders
        run: |
          flutter create . --project-name qassimha --org com.qassimha --platforms=android,ios
          rm -rf test

      - name: Set Arabic app name
        run: sed -i 's/android:label="[^"]*"/android:label="قسّمها"/' android/app/src/main/AndroidManifest.xml

      - run: flutter pub get
      - name: Build APK
        run: |
          set -o pipefail
          flutter build apk --release --no-shrink 2>&1 | tee build.log

      - name: Show Android errors
        if: failure()
        run: grep -n -E -B3 -A8 "What went wrong|Missing class|error:|Execution failed" build.log | head -120 || true

      - uses: actions/upload-artifact@v4
        with:
          name: qassimha-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate platform folders
        run: |
          flutter create . --project-name qassimha --org com.qassimha --platforms=android,ios
          rm -rf test

      - name: Set Arabic app name
        run: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName قسّمها" ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string نحتاج الكاميرا لقراءة الفاتورة" ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string نحتاج الوصول للصور لقراءة الفاتورة" ios/Runner/Info.plist
          sed -i '' "s/^#* *platform :ios, .*/platform :ios, '15.5'/" ios/Podfile
          sed -i '' "s/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*;/IPHONEOS_DEPLOYMENT_TARGET = 15.5;/g" ios/Runner.xcodeproj/project.pbxproj

      - run: flutter pub get
      - run: flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        run: |
          mkdir Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -r qassimha.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: qassimha-ios-ipa
          path: qassimha.ipa
